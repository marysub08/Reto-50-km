<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- wheel -->
  <g transform="translate(32,32)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle r="19" stroke-width="3.6"/>
    <circle r="3.4" fill="#ffffff" stroke="none"/>
    <!-- spokes -->
    <line x1="0" y1="0" x2="0"   y2="-19" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="16.5" y2="9.5" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="-16.5" y2="9.5" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="9.5"  y2="16.5" stroke-width="2.4" opacity=".85"/>
    <line x1="0" y1="0" x2="-9.5" y2="16.5" stroke-width="2.4" opacity=".85"/>
    <line x1="0" y1="0" x2="9.5"  y2="-16.5" stroke-width="2.4" opacity=".85"/>
    <line x1="0" y1="0" x2="-9.5" y2="-16.5" stroke-width="2.4" opacity=".85"/>
  </g>
</svg>
